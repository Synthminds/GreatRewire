name: verify

# Runs the two capabilities that need neither CEPII BACI nor network access, so the
# reproducibility claim in the README is checked on every push rather than asserted.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: C11 - generator equation self-test
        run: |
          out=$(python3 models/wtw_model.py)
          echo "$out"
          echo "$out" | grep -q "ALL PASS" || { echo "::error::generator self-test did not report ALL PASS"; exit 1; }

      - name: C3 - port validation against the published tables
        run: |
          out=$(python3 models/validate_completnet.py --iters 30 --seed 42)
          echo "$out"
          echo "$out" | grep -q "VERDICT: PASS" || { echo "::error::port validation failed its own contract"; exit 1; }

      - name: Regenerated validation reproduces the committed artifact
        run: |
          python3 - <<'PY'
          import subprocess, sys, io, pandas as pd
          committed = subprocess.run(
              ["git", "show", "HEAD:data/processed/port_validation.csv"],
              capture_output=True, text=True, check=True).stdout
          a = pd.read_csv(io.StringIO(committed), comment="#")
          b = pd.read_csv("data/processed/port_validation.csv", comment="#")
          if not a.equals(b):
              delta = (a - b).abs().max().max()
              print(f"::error::regenerated port_validation.csv differs from the committed copy "
                    f"(max abs diff {delta:.3e})")
              sys.exit(1)
          print(f"port_validation.csv reproduced exactly: {a.shape[0]} rows, {a.shape[1]} columns")
          PY
